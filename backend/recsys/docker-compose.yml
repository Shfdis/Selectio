services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recsys_postgres
    environment:
      POSTGRES_DB: recsys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - recsys_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recsys"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  recsys_data:
    driver: local
