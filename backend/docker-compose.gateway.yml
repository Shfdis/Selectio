version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: selectio_gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Gateway__InternalToken: ${GATEWAY_INTERNAL_TOKEN}
    depends_on:
      auth:
        condition: service_started
      crud:
        condition: service_started
    networks:
      - selectio_internal

  postgres:
    image: postgres:16-alpine
    container_name: selectio_postgres
    environment:
      POSTGRES_DB: selectio_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - selectio_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: selectio_auth
    # No host ports exposed in this mode
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UsersDb: Host=postgres;Database=selectio_main;Username=postgres;Password=postgres
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__SmtpUsername: ${EMAIL_SMTP_USERNAME}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__FromEmail: ${EMAIL_FROM_EMAIL}
      Email__FromName: ${EMAIL_FROM_NAME}
      Email__BaseUrl: ${EMAIL_BASE_URL}
      Email__AllowInsecureSsl: ${EMAIL_ALLOW_INSECURE_SSL}
      Gateway__InternalToken: ${GATEWAY_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - selectio_internal
    dns:
      - 8.8.8.8
      - 8.8.4.4

  crud:
    build:
      context: ./crud
      dockerfile: Dockerfile
    container_name: selectio_crud
    # No host ports exposed in this mode
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8090
      ConnectionStrings__CrudDb: Host=postgres;Database=selectio_main;Username=postgres;Password=postgres
      Gateway__InternalToken: ${GATEWAY_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - selectio_internal

networks:
  selectio_internal:
    driver: bridge
    enable_ipv6: false

volumes:
  postgres_data:
    driver: local

