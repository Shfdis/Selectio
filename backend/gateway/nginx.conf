worker_processes  1;

events { worker_connections 1024; }

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  upstream auth_upstream {
    server auth:8080;
  }

  upstream crud_upstream {
    server crud:8090;
  }

  server {
    listen 8080;

    # Basic health probe for compose / k8s.
    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok";
    }

    # Proxy to Auth service, stripping /auth prefix:
    # /auth/user -> http://auth:8080/user
    location /auth/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://auth_upstream/;
    }

    # Proxy to CRUD service, stripping /crud prefix:
    # /crud/swagger -> http://crud:8090/swagger
    location /crud/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://crud_upstream/;
    }

    # Default: guide user
    location / {
      add_header Content-Type text/plain;
      return 200 "gateway running. use /auth/* or /crud/*";
    }
  }
}

